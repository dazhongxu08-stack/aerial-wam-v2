# Near-field WM FT overlay for geomfix R3/R4 (depth-aux + coll rank hinge).
# Warm-start from depth_aux_long; train on three_zone_near / merged.

world_model:
  coll_pos_weight: 2.0
  coll_near_depth_m: 12.0
  coll_rank_hinge_weight: 4.0
  coll_rank_hinge_margin: 0.30
  coll_hinge_fwd_max_m: 4.5
  coll_fwd_depth_aux_weight: 2.5
  loss_scales:
    depth: 1.0
  depth_head:
    center_frac: 0.5
  decoder:
    train_only: true
