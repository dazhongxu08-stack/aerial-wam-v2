# Near-field WM FT — depth-aux + conditional coll rank (anti-saturation).
# Soft coll targets stay in [0,1]; hinge does forward/lateral separation.
# Warm-start from depth_aux_long; train on thickened near packs.

world_model:
  coll_pos_weight: 1.5
  coll_near_depth_m: 8.0
  coll_rank_hinge_weight: 8.0
  coll_rank_hinge_margin: 0.25
  coll_hinge_fwd_max_m: 6.0
  # Gate for continuous soft prox only (NOT a BCE target multiplier).
  coll_fwd_depth_aux_weight: 1.0
  loss_scales:
    depth: 1.75
  depth_head:
    center_frac: 0.5
  decoder:
    train_only: true
